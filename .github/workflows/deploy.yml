name: Build and deploy to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_ready: ${{ steps.config.outputs.deploy_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check deployment configuration
        id: config
        env:
          VITE_BIRTH_YEAR: ${{ secrets.VITE_BIRTH_YEAR }}
        run: |
          if [ -n "$VITE_BIRTH_YEAR" ]; then
            echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set the repository Actions secret VITE_BIRTH_YEAR to enable the Pages deployment."
          fi

      - name: Build
        env:
          VITE_BIRTH_YEAR: ${{ secrets.VITE_BIRTH_YEAR }}
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && steps.config.outputs.deploy_ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.deploy_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
