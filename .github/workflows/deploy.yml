name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate birthday year
        env:
          BIRTH_YEAR: ${{ vars.BIRTH_YEAR }}
        run: |
          if ! [[ "$BIRTH_YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "::error::Set the repository Actions variable BIRTH_YEAR to the four-digit birthday year."
            exit 1
          fi

      - name: Build
        env:
          VITE_BIRTH_YEAR: ${{ vars.BIRTH_YEAR }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
